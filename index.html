<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonusCom - Generador de Monedas de Descuento</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #0b1d22;
            --card-bg: #112930;
            --text-light: #f4f6f7;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            color: var(--primary-gold);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 1rem;
            color: #b0c4de;
        }
        .main-container {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-gold);
            border-radius: 15px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--primary-gold);
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2c3e50;
            background-color: #0b1d22;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-gold);
            outline: none;
        }
        /* Vista previa de la moneda generada */
        .preview-container {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            max-width: 240px;
            height: auto;
        }
        .btn-action {
            background-color: var(--primary-gold);
            color: var(--dark-bg);
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-action:hover {
            background-color: #f1c40f;
        }
    </style>
</head>
<body>

    <header>
        <h1>BonusCom</h1>
        <p>Generador de Monedas de Beneficios Exclusivos</p>
    </header>

    <div class="main-container">
        <div class="form-group">
            <label for="comercio">Nombre del Comercio:</label>
            <input type="text" id="comercio" value="Ej: Librería Central" oninput="actualizarMoneda()">
        </div>

        <div class="form-group">
            <label for="cliente">Nombre del Cliente / Usuario:</label>
            <input type="text" id="cliente" value="Ej: Juan Pérez" oninput="actualizarMoneda()">
        </div>

        <div class="form-group">
            <label for="descuento">Descuento Especial:</label>
            <select id="descuento" onchange="actualizarMoneda()">
                <option value="5%">5% OFF Extra</option>
                <option value="10%">10% OFF Extra</option>
                <option value="15%" selected>15% OFF Extra</option>
                <option value="20%">20% OFF Extra</option>
            </select>
        </div>

        <div class="preview-container">
            <!-- Aquí se dibuja la moneda dinámicamente con la imagen de fondo y las inscripciones -->
            <canvas id="coinCanvas" width="400" height="400"></canvas>
        </div>

        <button class="btn-action" onclick="descargarMoneda()">Descargar Moneda</button>
    </div>

    <script>
        const canvas = document.getElementById('coinCanvas');
        const ctx = canvas.getContext('2d');
        const bgImg = new Image();
        
        bgImg.crossOrigin = "anonymous";
        // Imagen de la moneda en Drive usada estrictamente como fondo
        bgImg.src = "https://lh3.googleusercontent.com/d/1Ad76Tk_9ar7o7EiOHPFlRA3ngg721oKg=s800";

        bgImg.onload = function() {
            actualizarMoneda();
        };

        function actualizarMoneda() {
            const comercio = document.getElementById('comercio').value;
            const cliente = document.getElementById('cliente').value;
            const descuento = document.getElementById('descuento').value;

            // Limpiar canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar la imagen de Drive como fondo base dentro del círculo de la moneda
            ctx.save();
            ctx.beginPath();
            ctx.arc(200, 200, 195, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // 2. Fondo semitransparente oscuro central para que las inscripciones y textos destaquen impecables sobre el búho
            ctx.fillStyle = "rgba(11, 29, 34, 0.82)";
            ctx.beginPath();
            ctx.arc(200, 200, 170, 0, Math.PI * 2);
            ctx.fill();

            // 3. Círculo interno decorativo dorado
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(200, 200, 165, 0, Math.PI * 2);
            ctx.stroke();

            // 4. Texto: Marca (BonusCom)
            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 26px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("BonusCom", 200, 60);

            // 5. Texto: Nombre del comercio
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "Segoe UI", sans-serif';
            ctx.fillText(comercio, 200, 100);

            // 6. Texto: Cliente / Usuario
            ctx.fillStyle = '#b0c4de';
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.fillText("Cliente: " + cliente, 200, 130);

            // 7. Gran número / porcentaje de descuento central
            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 60px "Segoe UI", sans-serif';
            ctx.fillText(descuento, 200, 215);

            // 8. Subtítulo del beneficio
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px "Segoe UI", sans-serif';
            ctx.fillText("BENEFICIO EXCLUSIVO", 200, 255);

            // 9. Franja inferior / inscripciones de cierre del círculo
            ctx.fillStyle = '#b0c4de';
            ctx.font = 'bold 13px "Segoe UI", sans-serif';
            ctx.fillText("• PÁGINAS BRONCEADAS •", 200, 310);
        }

        function descargarMoneda() {
            let descLimpio = document.getElementById('descuento').value.replace('%', '');
            const enlace = document.createElement('a');
            enlace.download = 'moneda-bonuscom-' + descLimpio + 'porc.png';
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        }

        // Ejecutar por si la imagen ya está en caché
        if (bgImg.complete) {
            actualizarMoneda();
        }
    </script>

</body>
</html>
